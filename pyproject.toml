[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tekmerion"
version = "0.1.0"
description = "Tekmerion — defensible AI research: append-only, hash-chained research records with per-claim verdicts."
requires-python = ">=3.12"
license = { text = "All rights reserved. (c) 2026 Axiovex Systems, LLC" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

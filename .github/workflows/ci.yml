name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out Axiomere (record layer, DN-007)
        uses: actions/checkout@v4
        with:
          repository: AXIOVEX/axiomere
          path: axiomere-core
      - uses: dtolnay/rust-toolchain@stable
      - name: Install (framework + Axiomere bindings + pytest)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest
          maturin build -m axiomere-core/crates/axiomere-py/Cargo.toml
          pip install axiomere-core/target/wheels/*.whl
          pip install git+https://github.com/AXIOVEX/axiomere-python
          pip install -e .
      - name: Run tests
        run: .venv/bin/python -m pytest -q
